name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-progress production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Validate data files
        run: ruby scripts/check_data.rb

      # Pages may not be enabled yet (e.g. a fresh copy of the template). Then the site is still
      # built and uploaded as the "example-site" artifact, only the deploy is skipped.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v6

      # With Pages enabled, url/baseurl come from the Pages settings (so the placeholders in
      # _config.yml don't matter); otherwise from _config.yml.
      - name: Build with Jekyll
        run: |
          if [ -n "$PAGES_ORIGIN" ]; then
            echo "url: \"$PAGES_ORIGIN\"" > "$RUNNER_TEMP/pages-url.yml"
            bundle exec jekyll build --baseurl "$PAGES_BASE_PATH" --config "_config.yml,$RUNNER_TEMP/pages-url.yml"
          else
            bundle exec jekyll build
          fi
        env:
          JEKYLL_ENV: production
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload example site
        uses: actions/upload-artifact@v7
        with:
          name: example-site
          path: _site/

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5

    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
